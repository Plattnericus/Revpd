# Revpd configuration.
#
# Copy to /etc/revpd/revpd.yaml. Secrets do NOT belong here — they come from
# the environment, see .env.example.
#
# Every value below is already the default. Delete what you do not need to
# change; a short config is easier to reason about than a complete one.
#
# A misspelled key makes startup fail rather than being ignored silently.
# For security settings that is deliberate.

data_dir: /var/lib/revpd


web:
  # The web interface, on the port a browser assumes so the address is just
  # the hostname. Together with relay.listen below these are the only ports
  # that need to face the internet.
  #
  # Binding below 1024 needs CAP_NET_BIND_SERVICE, which the unit file grants
  # and nothing else — the service still runs as an unprivileged account.
  #
  # Bind it to 127.0.0.1 instead if you would rather reach it through a tunnel:
  #     ssh -L 8443:127.0.0.1:443 you@gateway
  listen: ":443"

  # Tried in order when listen is already taken, by an existing web server for
  # instance. Coming up somewhere else and saying so in the log beats refusing
  # to start on a machine nobody can then reach to fix it.
  listen_fallbacks: [":8443", ":9443"]

  # Plain HTTP. Serves nothing but a permanent redirect to the portal, so
  # somebody who types the hostname without https:// still arrives rather than
  # meeting a dead port. Set to "" to leave 80 closed.
  http_listen: ":80"
  http_listen_fallbacks: [":8080", ":9080"]

  # What people type into their browser and their RDP client.
  # Also the WebAuthn relying-party ID — changing it invalidates all passkeys.
  hostname: gw.example.com

  # The portal always speaks TLS. Leaving these empty generates a self-signed
  # certificate into data_dir rather than falling back to plain HTTP — a
  # session cookie must never travel in the clear, and passkeys only work in a
  # secure context at all.
  #
  # Point them at a real certificate to stop browsers warning.
  tls_cert: ""
  tls_key: ""

  # Or let Let's Encrypt handle it. Needs port 80 reachable from outside,
  # which would be a third port; leave it off unless you want that.
  acme: false

  # Only set this when something like nginx sits in front. Trusting forwarded
  # headers from anywhere would let anyone claim any source address and walk
  # into somebody else's session.
  trusted_proxies: []


public:
  # How this gateway looks from the internet, which its own sockets cannot
  # see: behind a router they only ever know the LAN.
  #
  # Everything here is a display value. It decides what the portal prints, what
  # goes into a downloaded .rdp file and what the wake-up page tells people to
  # type. No grant, no token and no forwarding decision reads any of it — which
  # is what makes it safe for part of it to come from a stranger.

  # The domain or address people type from outside. A bare name or address:
  # no https:// in front, and no port on the end — the ports below cover that.
  #
  # Set this and it wins over anything detected, which is what a fixed domain
  # or a dynamic-DNS name is for. Leave it empty and the detected address is
  # used instead. Empty also falls back to web.hostname above, so an
  # installation that already set a real hostname needs nothing here.
  host: ""

  # Ask the internet what address it sees.
  #
  # A machine with a public address on one of its own interfaces — any VPS —
  # is answered from the interface and nobody is asked at all. Only a gateway
  # behind NAT ever sends the question out.
  #
  # Turn it off and this gateway never mentions itself to a third party; only
  # host above is then used.
  detect: true

  # Who to ask. They answer with the caller's address and nothing else.
  #
  # All three are asked at once and two have to agree before an answer is
  # believed, so one endpoint going bad cannot move the result on its own.
  # Replace them with anything that behaves the same — including something you
  # run yourself, if asking strangers is not welcome.
  #
  # HTTPS only, and enforced. Over plain HTTP anyone on the path could choose
  # the address the portal then hands out to everybody.
  resolvers:
    - https://api.ipify.org
    - https://icanhazip.com
    - https://ifconfig.co/ip

  # How often to look again. Home connections change address without warning,
  # so this is not a question to answer once at startup. Below 5m is rejected:
  # an address does not change by the minute, and hammering a free endpoint is
  # how it stops being free.
  refresh: 1h

  # The port on your router that forwards to relay.listen below.
  #
  # 0 means it forwards the same number straight through, which is the usual
  # case and needs nothing here. Set it when the two differ — forwarding some
  # high port to 3389 keeps the internet's constant scan of 3389 off the door,
  # and the address the portal prints has to say so:
  #
  #     rdp_port: 33890     ->  connect to gw.example.com:33890
  #
  # This changes what is printed, not what is listened on. The forwarding rule
  # itself lives in the router.
  rdp_port: 0

  # The same for the web interface.
  portal_port: 0


relay:
  # The one port that faces the internet. Everything arrives here.
  listen: ":3389"

  # Rejected connections are held briefly instead of being closed at once.
  # Scanners hammering 3389 pay for the wait; real clients never land here.
  tarpit: 5s

  max_conns_per_ip: 8
  dial_timeout: 10s

  # Drops a session that has gone quiet, so a half-dead link frees its
  # file descriptors instead of lingering.
  idle_timeout: 4h


grant:
  # How long a passed MFA stays good for STARTING a connection. A session
  # that is already running is not affected by this.
  ttl: 2m

  # After a dropped link the client may reconnect within this window without
  # a fresh MFA round. Without it, every WLAN handover would ask again.
  reuse_window: 10m

  # A grant is tied to the address it was issued to. 32 means an exact match.
  # Lower it only if your clients roam within a carrier block and you accept
  # the trade.
  ipv4_prefix_bits: 32
  ipv6_prefix_bits: 64


rdp_login:
  # The normal way in. You type your password and one-time code straight into
  # the Windows Remote Desktop client:
  #
  #     MyPassword,123456        code from your authenticator app
  #     MyPassword,push          approve on your phone (needs Duo)
  #     MyPassword,K7RM2-9XQPD   backup code
  #
  # The gateway checks it, wakes the machine, and tells the client to reconnect
  # to the real one. No browser involved.
  enabled: true

  # Certificate the RDP listener presents. Leave empty and a self-signed one is
  # generated into data_dir — the same thing a stock Windows host does, so the
  # client shows the same "identity cannot be verified" prompt either way.
  # Point these at a real certificate to make the prompt go away.
  tls_cert: ""
  tls_key: ""

  # Budget for the whole login, including waiting for the machine to boot.
  timeout: 3m

  # Budget for a single step, so a stalled client cannot hold a slot.
  step_timeout: 30s

  # Hand the password on to Windows so you type it once. Turn this off and
  # Windows asks again over NLA — safer, because the gateway then never holds
  # a credential it could pass along, but you type twice.
  pass_through_credentials: true


jit:
  # Approve a connection out of band instead of typing a code: the client
  # connects, your phone buzzes, you tap approve.
  #
  # Off by default. It leans on the username the RDP client sends, which is
  # not authenticated — it only decides who gets asked. Needs Duo configured.
  enabled: false

  # How long the connection is held while waiting for that approval.
  hold_timeout: 45s
  peek_timeout: 5s
  max_pending_per_ip: 3

  # Used when the client cannot say which machine it wants. Leave empty if
  # each account has exactly one target.
  default_target: ""


wol:
  probe_interval: 500ms

  # Windows accepts the TCP handshake a moment before RDP is really ready.
  # Connecting into that gap gives a confusing protocol error.
  probe_settle: 2s

  # Guards against a single dropped UDP datagram.
  repeat: 3


auth:
  session_ttl: 12h
  session_idle: 30m

  # Failures beyond this trigger a lockout that doubles each time.
  max_failures: 5
  lockout_base: 30s
  lockout_max: 1h

  # Extra 30-second steps accepted on each side of now. 1 is the sane value:
  # it forgives a slightly wrong clock without widening the window much.
  totp_skew: 1

  backup_codes: 10

  # Which environment variable holds the at-rest encryption key.
  master_key_env: REVPD_MASTER_KEY


rdgw:
  # Remote Desktop Gateway over HTTPS, for networks where 3389 cannot be
  # exposed at all. Needs a certificate from a real CA and a hostname
  # rather than an IP for the target.
  enabled: false
  listen: ":443"
  token_ttl: 5m


notify:
  # Send a short message when something happens that is worth knowing about
  # away from the machine — somebody connected, an account locked itself, an
  # approval is waiting. It hangs off the activity log, so anything recorded
  # there can be reported.
  #
  # Off by default: it is the one part of the gateway that talks to a service
  # nobody here runs.
  enabled: false

  # Where messages go. Treat this like a password — whoever knows it can post
  # to that channel — which is why plain HTTP is only accepted to an address
  # on your own network.
  #
  #   https://ntfy.sh/some-hard-to-guess-topic
  #   https://discord.com/api/webhooks/…
  #   https://hooks.slack.com/services/…
  url: ""

  # ntfy | discord | slack | json. Anything else takes the JSON form: a POST
  # with event, title, body and a timestamp.
  format: ntfy

  # Which events are worth a message. Everything else is still written to the
  # activity log; this only decides what leaves the machine.
  #
  # Also available: relay.close, relay.rejected, grant.issued, grant.denied,
  # login.ok, login.fail, mfa.fail, jit.approved, jit.denied, jit.timeout,
  # wol.sent, target.online, target.timeout, user.created, mfa.reset,
  # settings.updated, update.applied
  events: [relay.open, lockout, jit.requested]

  timeout: 10s


update:
  # Ask GitHub every few hours whether a newer release exists. One API call,
  # nothing is downloaded, and the dashboard shows what it found.
  enabled: true

  # Where releases come from. Empty derives it from the repository this was
  # built from, so a fork updates from the fork with nothing to configure.
  repo: ""

  # Download and install without being asked. Off by default because
  # installing restarts the service, which drops every live RDP session.
  #
  # This is the starting value only: the toggle in the dashboard overrides it
  # once an administrator has used it.
  auto_install: false

  # Wait for nobody to be connected before an automatic install. Without this
  # an update can cut a remote desktop session mid-sentence.
  only_when_idle: true

  # Accept release candidates. GitHub's "latest release" skips them, so this
  # changes which release is considered at all.
  prerelease: false

  # Below 15m GitHub's anonymous rate limit (60 calls an hour per address)
  # runs out, and the config is rejected.
  check_interval: 6h
