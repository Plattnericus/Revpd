name: release

# Publishes the artefacts install.sh downloads.
#
# Without this, `releases/latest` either 404s (no release at all) or resolves to
# a tag with no files attached, and the installer fails at the download step.
#
# Three ways in, so a release never has to have files attached by hand:
#
#   release.published  — creating a release in the web interface builds and
#                        attaches the archives to it on its own. This is the
#                        normal path.
#   push of a v* tag   — `git push origin v1.2.3` does the same without ever
#                        opening a browser.
#   workflow_dispatch  — repairs a release that was published before this
#                        workflow existed.

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach artefacts to (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the tag
        id: tag
        run: |
          # release.published carries the tag in the event; a tag push has it
          # in ref_name; workflow_dispatch is told it.
          tag="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "::error::tag '$tag' must start with 'v'"; exit 1 ;;
          esac
          {
            echo "tag=$tag"
            # install.sh builds the filename from the tag with the leading v
            # stripped. Both sides derive it the same way so they cannot drift.
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the web interface
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check the frontend landed where the binary embeds it from
        run: |
          # go:embed fails with a confusing error when this is missing, so say
          # it plainly here instead.
          test -f internal/web/dist/index.html \
            || { echo "::error::web build produced no internal/web/dist/index.html"; exit 1; }

      - name: Test
        run: go test ./...

      - name: Build and package
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release

          # Debian and Ubuntu on a PC or a server are linux/amd64; a Raspberry
          # Pi 4 or 5 running Raspberry Pi OS 64-bit is linux/arm64, and the
          # 32-bit image is linux/arm. The rest are there so the binary can be
          # run from a workstation, not because the gateway is installed there.
          #
          # install.sh only ever fetches the linux archives; the others are for
          # people who want the CLI locally.
          for target in \
              linux/amd64 linux/arm64 linux/arm linux/riscv64 \
              darwin/amd64 darwin/arm64 \
              windows/amd64 windows/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            echo "==> $goos/$goarch"

            binary=revpd
            [ "$goos" = windows ] && binary=revpd.exe

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "release/stage/${binary}" ./cmd/revpd

            install -m 0644 README.md release/stage/README.md

            # The installer looks for exactly this name and expects the binary
            # at the root of the archive. Windows gets a zip because that is
            # what opens with a double click there.
            if [ "$goos" = windows ]; then
              ( cd release/stage && zip -q "../revpd_${VERSION}_${goos}_${goarch}.zip" "$binary" README.md )
            else
              tar -czf "release/revpd_${VERSION}_${goos}_${goarch}.tar.gz" \
                  -C release/stage "$binary" README.md
            fi
            rm -rf release/stage
          done

          cd release
          sha256sum ./*.tar.gz ./*.zip | sed 's| \./| |' > checksums.txt
          echo "--- artefacts ---"
          cat checksums.txt

      - name: Verify the archives are what the installer expects
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c checksums.txt

          # Unpack the way install.sh does and run it, so a broken archive is
          # caught here rather than on someone's server.
          tmp=$(mktemp -d)
          tar -xzf "revpd_${VERSION}_linux_amd64.tar.gz" -C "$tmp"
          test -x "$tmp/revpd" || { echo "::error::archive has no executable revpd"; exit 1; }

          got=$("$tmp/revpd" version)
          echo "binary reports: $got"
          test "$got" = "revpd ${VERSION}" \
            || { echo "::error::binary reports '$got', expected 'revpd ${VERSION}'"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          # A release may already exist — created in the web UI, or by a rerun.
          # Create it only if it does not, then attach the files either way.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists, attaching artefacts"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

          gh release upload "$TAG" release/*.tar.gz release/checksums.txt --clobber

          # A draft is invisible to releases/latest, so the installer would keep
          # 404ing with the release sitting right there.
          gh release edit "$TAG" --draft=false

      - name: Confirm the installer can now resolve it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          echo "$names"

          # These are the ones install.sh and the built-in updater reach for.
          # A release missing them is not installable, whatever else it has.
          for want in \
              "revpd_${{ steps.tag.outputs.version }}_linux_amd64.tar.gz" \
              "revpd_${{ steps.tag.outputs.version }}_linux_arm64.tar.gz" \
              "checksums.txt"; do
            grep -qx "$want" <<<"$names" \
              || { echo "::error::$want is missing from the release"; exit 1; }
          done
